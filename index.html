<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0f19">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>JMF BOT | الاتصال السحابي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0b0f19; --panel: #151a28; --primary: #00d4ff; --secondary: #0088ff;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(0, 212, 255, 0.2);
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; background: var(--bg); color: var(--text-main); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
            padding: 30px 20px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-box {
            width: 80px; height: 80px; background: rgba(0, 212, 255, 0.1); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto;
            border: 1px solid var(--border);
        }
        .logo-box svg { width: 40px; height: 40px; color: var(--primary); }
        h1 { font-size: 22px; margin: 0 0 10px 0; color: #fff; }
        p { font-size: 13px; color: var(--text-muted); margin: 0 0 25px 0; }
        #input-view, #waiting-view { display: none; }
        input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid #334155; color: #fff;
            padding: 15px; border-radius: 12px; font-size: 16px; text-align: center; outline: none; margin-bottom: 20px;
        }
        .btn {
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 800; color: #000;
            cursor: pointer; background: linear-gradient(to right, var(--primary), var(--secondary));
        }
        .pulse-loader {
            width: 60px; height: 60px; background: var(--primary); border-radius: 50%;
            margin: 20px auto; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 212, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
        }
        .footer { margin-top: 30px; font-size: 11px; color: #64748b; }
        
        /* Internal Chat Modal */
        #chat-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.95); z-index: 3000000;
            display: none; flex-direction: column; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .chat-container {
            flex: 1; display: flex; flex-direction: column; max-width: 500px;
            margin: 0 auto; width: 100%; background: var(--panel);
            border-left: 1px solid var(--border); border-right: 1px solid var(--border);
        }
        .chat-header {
            padding: 15px 20px; background: rgba(0, 212, 255, 0.1);
            border-bottom: 1px solid var(--border); display: flex;
            justify-content: space-between; align-items: center;
        }
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 12px;
        }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .msg.admin { align-self: flex-start; background: #1e293b; color: #fff; border-bottom-left-radius: 2px; }
        .msg.user { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 2px; font-weight: 600; }
        .chat-input-area {
            padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border);
            display: flex; gap: 10px; align-items: center;
        }
        .chat-input-area input { margin-bottom: 0; flex: 1; text-align: right; font-size: 14px; padding: 12px; }
        .chat-send-btn {
            background: var(--primary); border: none; width: 45px; height: 45px;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #000;
        }
        
        /* Floating Message Button */
        .floating-msg-btn {
            position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px;
            background: linear-gradient(135deg, #0088cc, #00aaff);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            cursor: pointer; z-index: 2000000; transition: all 0.3s ease;
            text-decoration: none; border: 2px solid rgba(255,255,255,0.1);
        }
        .floating-msg-btn:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 8px 25px rgba(0, 136, 204, 0.6); }
        .floating-msg-btn svg { width: 30px; height: 30px; color: white; }
        .floating-msg-btn::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 2px solid #00d4ff;
            animation: ripple 2s infinite; opacity: 0;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        
        #dashboard-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: var(--bg); }
        #dashboard-view iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="login-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100%;">
        <div class="container">
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
            </div>
            <div id="input-view">
                <h1>أهلاً بك في JMF</h1>
                <p>يرجى إدخال معرف الجهاز (Device ID) للاتصال.</p>
                <input type="text" id="acc-input" placeholder="a1b2c3d4">
                <button class="btn" onclick="saveAndConnect()">الاتصال بلوحة التحكم</button>
            </div>
            <div id="waiting-view">
                <h1>بانتظار تشغيل البوت..</h1>
                <div class="pulse-loader"></div>
                <p>يرجى تشغيل تطبيق JMF BOT على حاسوبك.</p>
                <a href="#" style="color:var(--primary); font-size:12px;" onclick="logout()">تغيير معرف الجهاز</a>
                <button id="pwa-install-btn" class="btn" style="display:none; margin-top:20px; background: #1e293b; color: #fff; border: 1px solid var(--primary);">تثبيت التطبيق</button>
            </div>
        </div>
        <div class="footer">JMF Cloud Connect &copy; 2026</div>
    </div>

    <div id="dashboard-view"></div>

    <!-- Floating Messaging Icon -->
    <div onclick="toggleChat()" class="floating-msg-btn" title="Internal Chat">
        <i data-lucide="message-square"></i>
    </div>

    <!-- Internal Chat UI -->
    <div id="chat-modal">
        <div class="chat-container">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i data-lucide="message-circle" style="color:var(--primary); width:20px;"></i>
                    <div style="display:flex; flex-direction:column;">
                        <b style="font-size:14px;">المراسلة الفورية | Internal Chat</b>
                        <span id="chat-id-display" style="font-size:10px; color:var(--primary); font-family:monospace;">ID: -</span>
                    </div>
                </div>
                <button onclick="toggleChat()" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer;">
                    <i data-lucide="x" style="width:24px;"></i>
                </button>
            </div>
            <div id="user-chat-messages" class="chat-messages">
                <div style="text-align:center; color:var(--text-muted); margin-top:50px;">جاري تحميل المحادثة...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendUserMsg()">
                <button class="chat-send-btn" onclick="sendUserMsg()">
                    <i data-lucide="send" style="width:20px;"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const FB_URL = "https://jmf-bot-default-rtdb.firebaseio.com/licenses";
        const CHATS_URL = "https://jmf-bot-default-rtdb.firebaseio.com/chats";
        
        let deferredPrompt;
        const installBtn = document.getElementById('pwa-install-btn');
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
        let retryInterval = null;
        let chatInterval = null;
        let fullHwid = null;

        function toggleChat() {
            const modal = document.getElementById('chat-modal');
            const devId = fullHwid || localStorage.getItem('jmf_dev_id');
            if(!devId) { alert("يرجى الاتصال أولاً | Please connect first"); return; }
            
            const isOpen = modal.style.display === 'flex';
            modal.style.display = isOpen ? 'none' : 'flex';
            
            if (!isOpen) {
                document.getElementById('chat-id-display').innerText = `ID: ${devId}`;
                loadUserMessages();
                if(chatInterval) clearInterval(chatInterval);
                chatInterval = setInterval(loadUserMessages, 3000);
                lucide.createIcons();
            } else {
                clearInterval(chatInterval);
            }
        }

        async function loadUserMessages() {
            const devId = fullHwid || localStorage.getItem('jmf_dev_id');
            if(!devId) return;
            try {
                const res = await fetch(`${CHATS_URL}/${devId}/messages.json`);
                const messages = await res.json();
                const container = document.getElementById('user-chat-messages');
                if(!messages) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:50px;">لا توجد رسائل سابقة</div>';
                    return;
                }
                
                container.innerHTML = "";
                const msgList = Array.isArray(messages) ? messages.filter(m => m) : Object.values(messages);
                
                msgList.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.sender === 'admin' ? 'admin' : 'user'}`;
                    if(m.type === 'image') {
                        div.innerHTML = `<img src="${m.text}" style="max-width:100%; border-radius:10px; cursor:pointer;" onclick="window.open('${m.text}')">`;
                    } else {
                        div.innerText = m.text;
                    }
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch(e) {}
        }

        async function sendUserMsg() {
            const devId = fullHwid || localStorage.getItem('jmf_dev_id');
            const input = document.getElementById('user-chat-input');
            const text = input.value.trim();
            if(!devId || !text) return;
            
            const msg = { sender: 'user', text: text, type: 'text', timestamp: Date.now() };
            try {
                await fetch(`${CHATS_URL}/${devId}/messages.json`, {
                    method: 'POST',
                    body: JSON.stringify(msg)
                });
                input.value = "";
                loadUserMessages();
            } catch(e) { alert("خطأ في الإرسال"); }
        }

        async function checkConnection(devId) {
            try {
                const response = await fetch(`${FB_URL}/${devId}.json`, { cache: "no-store" });
                const data = await response.json();
                if(data) {
                    if(data.device_id) fullHwid = data.device_id;
                    if(data.url) {
                        try {
                            await fetch(data.url, { mode: 'no-cors' });
                            const dashView = document.getElementById('dashboard-view');
                            dashView.innerHTML = `<iframe src="${data.url}"></iframe>`;
                            dashView.style.display = 'block';
                            document.getElementById('login-screen').style.display = 'none';
                            if(retryInterval) clearInterval(retryInterval);
                            return true;
                        } catch (e) {}
                    }
                }
            } catch (e) {}
            return false;
        }

        function saveAndConnect() {
            const devId = document.getElementById('acc-input').value.trim();
            if(!devId) return;
            localStorage.setItem('jmf_dev_id', devId);
            startWaiting(devId);
        }

        function startWaiting(devId) {
            document.getElementById('input-view').style.display = 'none';
            document.getElementById('waiting-view').style.display = 'block';
            checkConnection(devId);
            retryInterval = setInterval(() => checkConnection(devId), 5000);
        }

        function logout() { localStorage.removeItem('jmf_dev_id'); location.reload(); }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const devParam = urlParams.get('dev');
            if(devParam) {
                localStorage.setItem('jmf_dev_id', devParam);
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const savedId = localStorage.getItem('jmf_dev_id');
            if (savedId) startWaiting(savedId);
            else document.getElementById('input-view').style.display = 'block';
            lucide.createIcons();
        };
    </script>
</body>
</html>
